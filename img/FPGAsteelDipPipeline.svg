<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1000 840"
   font-family="'Segoe UI', Arial, sans-serif"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="line-fill" d="M 0,0 10,5 0,10 Z" />
    </marker>
    <style>
      .bg      { fill: #ffffff; }
      .panel   { fill: #fafafa; stroke: #888; }
      .accent  { fill: #2ca02c; stroke: #1e7a1e; }
      .single  { fill: #3a6ea5; stroke: #264d73; }
      .txt         { fill: #222; }
      .txt-muted   { fill: #555; }
      .txt-accent  { fill: #ffffff; }
      .txt-single  { fill: #ffffff; }
      .line       { stroke: #555; }
      .line-fill  { fill: #555; }

      @media (prefers-color-scheme: dark) {
        .bg      { fill: #1e1e1e; }
        .panel   { fill: #2a2a2a; stroke: #777; }
        .accent  { fill: #2ca02c; stroke: #8be28b; }
        .single  { fill: #5b8fc7; stroke: #a9cbee; }
        .txt         { fill: #eaeaea; }
        .txt-muted   { fill: #bbbbbb; }
        .txt-accent  { fill: #ffffff; }
        .txt-single  { fill: #ffffff; }
        .line       { stroke: #bbbbbb; }
        .line-fill  { fill: #bbbbbb; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="840" />

  <text x="500" y="26" text-anchor="middle" font-size="18" class="txt-muted">
    DualCoreDIP::process() — 9 fork/joins + 2 single-core steps, top to bottom
  </text>

  <!-- legend -->
  <rect class="accent" x="330" y="38" width="18" height="18" rx="4" />
  <text x="354" y="52" font-size="13" class="txt-muted">runs on both cores (forkJoin)</text>
  <rect class="single" x="580" y="38" width="18" height="18" rx="4" />
  <text x="604" y="52" font-size="13" class="txt-muted">CPU0 only</text>

  <!-- stage template: box x=250 w=400 h=40, pitch=60, first y=76 -->

  <!-- 1: step01 -->
  <rect class="accent" x="250" y="76" width="400" height="40" rx="8" />
  <text x="450" y="101" text-anchor="middle" font-size="15" class="txt-accent">step01 — RGB565 → RGB24 + Grayscale</text>
  <text x="660" y="101" font-size="12" class="txt-muted">extra join invalidate: CPU0 refreshes CPU1's half</text>
  <line class="line" x1="450" y1="116" x2="450" y2="136" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2: step03 -->
  <rect class="accent" x="250" y="136" width="400" height="40" rx="8" />
  <text x="450" y="161" text-anchor="middle" font-size="15" class="txt-accent">step03 — binarize @ threshold, count</text>
  <text x="660" y="161" font-size="12" class="txt-muted">early exit → EMPTY if count &lt; OBJECT_MIN_PIXELS</text>
  <line class="line" x1="450" y1="176" x2="450" y2="196" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3: erode pass 1 -->
  <rect class="accent" x="250" y="196" width="400" height="40" rx="8" />
  <text x="450" y="221" text-anchor="middle" font-size="15" class="txt-accent">erode 3×3, pass 1</text>
  <line class="line" x1="450" y1="236" x2="450" y2="256" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4: erode pass 2 -->
  <rect class="accent" x="250" y="256" width="400" height="40" rx="8" />
  <text x="450" y="281" text-anchor="middle" font-size="15" class="txt-accent">erode 3×3, pass 2 (→ saved as E2)</text>
  <text x="660" y="275" font-size="12" class="txt-muted">erode/dilate read the full frame:</text>
  <text x="660" y="291" font-size="12" class="txt-muted">rows near the split belong to the other core</text>
  <line class="line" x1="450" y1="296" x2="450" y2="316" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5: dilate pass 1 -->
  <rect class="accent" x="250" y="316" width="400" height="40" rx="8" />
  <text x="450" y="341" text-anchor="middle" font-size="15" class="txt-accent">dilate 3×3, pass 1</text>
  <line class="line" x1="450" y1="356" x2="450" y2="376" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 6: dilate pass 2 -->
  <rect class="accent" x="250" y="376" width="400" height="40" rx="8" />
  <text x="450" y="401" text-anchor="middle" font-size="15" class="txt-accent">dilate 3×3, pass 2 (= opened image)</text>
  <line class="line" x1="450" y1="416" x2="450" y2="436" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 7: step06 single-core -->
  <rect class="single" x="250" y="436" width="400" height="40" rx="8" />
  <text x="450" y="461" text-anchor="middle" font-size="15" class="txt-single">step06 — border check</text>
  <text x="660" y="455" font-size="12" class="txt-muted">full-frame invalidate first (single-core read</text>
  <text x="660" y="471" font-size="12" class="txt-muted">of data the other core last wrote)</text>
  <text x="660" y="487" font-size="12" class="txt-muted">early exit → ON_BORDER if object touches edge</text>
  <line class="line" x1="450" y1="476" x2="450" y2="496" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 8: step07 -->
  <rect class="accent" x="250" y="496" width="400" height="40" rx="8" />
  <text x="450" y="521" text-anchor="middle" font-size="15" class="txt-accent">step07 — boundary = opened &amp; ~E2</text>
  <line class="line" x1="450" y1="536" x2="450" y2="556" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 9: step08 -->
  <rect class="accent" x="250" y="556" width="400" height="40" rx="8" />
  <text x="450" y="581" text-anchor="middle" font-size="15" class="txt-accent">step08 — bounding box; centroid = bbox center</text>
  <line class="line" x1="450" y1="596" x2="450" y2="616" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 10: step09 -->
  <rect class="accent" x="250" y="616" width="400" height="40" rx="8" />
  <text x="450" y="641" text-anchor="middle" font-size="15" class="txt-accent">step09 — overlay boundary in red on RGB24</text>
  <line class="line" x1="450" y1="656" x2="450" y2="676" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 11: draw overlay single-core -->
  <rect class="single" x="250" y="676" width="400" height="40" rx="8" />
  <text x="450" y="701" text-anchor="middle" font-size="15" class="txt-single">draw centroid cross + bbox in green</text>
  <text x="660" y="701" font-size="12" class="txt-muted">CPU0 only; return → OK</text>

  <text x="500" y="760" text-anchor="middle" font-size="14" class="txt-muted">
    every accent box is one forkJoin(): Core1::dispatch() + synchronous
  </text>
  <text x="500" y="780" text-anchor="middle" font-size="14" class="txt-muted">
    run on CPU0 + busy-poll join, exactly as in Figure 1 of
  </text>
  <text x="500" y="800" text-anchor="middle" font-size="14" class="txt-muted">
    08_DualCoreForwardingExample.md
  </text>
</svg>
